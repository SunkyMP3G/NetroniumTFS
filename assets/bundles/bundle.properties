item.netroniummod-guide-boss.details = [white]Large enemy units with huge health and damage, topped up with their own special abilities.[red]\n\
When any boss is alive, player's building is half as effective.[]



### Lore (SPOILERS AHEAD)
# Main
item.netroniummod-lore-intro.name = Lore Database
item.netroniummod-lore-intro.description = [cyan]Click 'i' to see details
item.netroniummod-lore-intro.details = [white]This is the start of Netronium mod lore and how things between [accent]Sharded[] and [red]Crux []escalate. \n\
All the content is revealed by completing sectors of the campaign. Click on unlocked lore items in the tree to see details.[red]\n\
IMPORTANT - This mod is a fan-made branch of the main campaign. While it is related to main Mindustry lore in some way, it IS NOT AN OFFICIAL sequel/continuation of the game lore.\n\
Don't take it seriously when talking about the Mindustry lore.[]\nThanks.

# Factions
item.netroniummod-sharded-lore.name = Faction: Sharded - Introduction
item.netroniummod-sharded-lore.description = [cyan]Click 'i' to see details
item.netroniummod-sharded-lore.details = [white]The main faction of humanity. \nAfter inventing space and military technologies on Netronium, they started colonizing other planets, like Serpulo.[red]\n\
But some people had other plans and started exploring other places in space...

item.netroniummod-crux-lore.name = Faction: Crux - Introduction
item.netroniummod-crux-lore.description = [cyan]Click 'i' to see details
item.netroniummod-crux-lore.details = [white][accent]Separated from the Sharded[], just one person with enough hate of humanity had managed to make many military constructs to mess up Sharded's conquest of Serpulo.\n\
He also managed to recruit hundreds of soldiers from them. \nThey have been defeated on Serpulo, which made Crux want to get rid of the roots - [sky]The Netronium[].

item.netroniummod-netronium-lore.name = The Netronium - Introduction
item.netroniummod-netronium-lore.description = [cyan]Click 'i' to see details
item.netroniummod-netronium-lore.details = [white]The home planet of Sharded and all the humanity. \n\
It has lots of crystals and underground water, but lacks wild life, so all food is either artificial or crops. \n\
Currently invaded by Crux, but most people were evacuated to the [accent]Sharded Space Station[].



