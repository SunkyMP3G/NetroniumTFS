### Guides
item.netroniummod-guide-intro.name = Guides

item.netroniummod-guide-energy.name = Basics of energy
item.netroniummod-guide-energy.description = [cyan]Click 'i' to see details
item.netroniummod-guide-energy.details = [white]Energy is used the same as in original game, but with some twists: \n\
It is only generated in core, so players have to build carefully, and it's only transported by wires, which makes logistics much more complicated. \nLeftover energy can be put in energy turrets.

