### Campaign
# First Steps
firststeps1 = Welcome to [cyan]Netronium[]!\n[red]Crux []has just invaded the planet. We need to protect and reclaim it back!
firststeps2 = Let us quickly recap your tutorial.
firststeps3 = You need [purple]Dionite[] for simple stuff. [accent]Mine it[].
firststeps4 = Research [accent]Dionite Drill, Conveyor and Wire[].
firststeps5 = [accent]IMPORTANT: Core is your only energy generator[].\nIt can power [red]limited amount of buildings[], so don't go overboard with it!
#pan - Drill example
firststeps6 = [accent]We'll show you an example...
#unpan
firststeps7 = Now, get more [purple]Dionite[].
firststeps8 = There's also another common material - [green]Gatride[]. It's used to easily build basic mechanisms.\n[accent]Use Dionite Drills to mine it[].
#pan - Portal appears
firststeps9 = [red]We have detected an enemy presence![]\nThey have sent a portal next to you. It will teleport enemy units to destroy your base.
#unpan
firststeps10 = [accent]Research Origin turret and Dionite Wall.\nPlace some turrets, load them and build walls to protect them.
firststeps11 = [red]The portal is fully charged. Prepare to defend!

# The Lake
thelake1 = That's a good landing!
#pan - Enemy base overview
thelake2 = See that enemy outpost over here?
thelake3 = It seems like it focuses on building tanks.
thelake4 = Why do they even need tanks in such closed area?
#unpan
thelake5 = Anyway, you need to destroy it.
thelake6 = You need units to do so, but your basic materials won't suffice.
thelake7 = We need [accent]Plating[]. \nIt is made out of [accent]Gatride[] and [accent]Hermite[], which is mined by a wall drill. \nAll that needs to be put in [accent]Plating Press[].
thelake8 = [accent]Research everything on the list.
thelake9 = Great. Now get some Plating ready! Be quick, enemy has already detected you!
thelake10 = Research and build [accent]Unit Assembler[] and make whatever units you like.\nUse them to destroy the enemy!
anyunit = [accent]Assemble any unit
thelake11 = It seems like our forces had to retreat due to Crux' sheer power.\nI need to go visit the captain now.
thelake12 = Nice job! I told the captain about you, and he's glad you are still alive.\nHe said that you don't really have chances against the whole Crux right now,\n\
but you will hopefully win us enough time for [orange]Radiance Squad[] to arrive and settle everything. It will take several days.\nYou are now on your own.\n[accent]Good luck![]



